<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../Style/ForgotPassword.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
  <nav>
    <a href="#" class="nav-logo">
      <div class="logo-icon">✦</div>
      Miro
    </a>
  </nav>

  <main>
    <div class="page-center">
      <div class="forgot-card">
        <h1 class="card-title">Forgot password?</h1>
        <p class="card-subtitle">No worries, we'll send you reset instructions.</p>

        <label>Email</label>
        <div class="input-wrap">
          <input type="email" class="form-input" placeholder="email@mail.com" id="emailInput" />
        </div>

        <button class="btn-send" onclick="handleReset()">
          Send reset link →
        </button>

        <a href="LoginParent.html" class="back-link">← Back to login</a>
      </div>
    </div>
  </main>
</body>
</html>
