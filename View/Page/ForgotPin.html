<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot pin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../Style/ForgotPin.css">
    <link rel="stylesheet" href="../Style/Variables.css">
    <script src="../Script/ForgotPin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  </head>
  <body>
    <nav>
      <a href="#" class="nav-logo">
        <div class="logo-icon">✦</div>
        Miro
      </a>
    </nav>

    <main>
      <div class="page-center">
        <div class="register-card">
          <button class="back-btn"><a href="LoginChild.html">← Change hero</a></button>
          <div class="card-header-block">
            <h1 class="card-title">No worries, hero !</h1>
            <p class="card-subtitle">Forgetting your secret code happens to the best of us. Ask a parent to help you create a new one.</p>
          </div>

          <label>Your account password <a href="ForgotPassword.html">Forgot?</a></label>
          <div class="input-wrap">
            <input type="password" class="form-input" placeholder="••••••••" id="passwordInput" required/>
            <img class="toggle-pass" id="toggleBtn" onclick="togglePassword()" src="../Assets/img/icon-eye-open.png" alt="Show/Hide password" >
          </div>

          <label>New pin</label>
          <div class="input-wrap">
            <input type="password" class="form-input" placeholder="••••" id="secretPin" maxlength="4" required/>
          </div>

          <label>Confirm new pin</label>
          <div class="input-wrap">
            <input type="password" class="form-input" placeholder="••••" id="confirmSecretPin" maxlength="4" required/>
          </div>

          <button class="btn-new-pin" onclick="setNewPin()"> Set new pin <span>→</span> </button>
          <button class="btn-cancel"> <span>←</span> <a href="LoginChild.html">Try my code again</a></button>
        </div>
      </div>
    </main>
  </body>
</html>
